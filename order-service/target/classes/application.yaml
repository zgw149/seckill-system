server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/seckill_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    data:
      redis:
        host: localhost
        port: 6379
        database: 0
        timeout: 1000ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# RestClientConfig 中 @Value("${services.product.base-url}") 依赖此配置项，
# 缺失会导致启动时 "Could not resolve placeholder" 报错
services:
  product:
    base-url: http://localhost:8081

app:
  saga:
    initial-delay-ms: 10000
    delay-ms: 5000
  outbox:
    batch-size: 20
    max-attempts: 3
    lease-seconds: 90
    ack-timeout-seconds: 10
    initial-delay-ms: 5000
    poll-ms: 3000
  order:
    expire-enabled: false
    expire-minutes: 15
    cancel-initial-delay-ms: 12000
    cancel-delay-ms: 5000